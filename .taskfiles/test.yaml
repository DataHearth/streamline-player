version: "3"

tasks:
  default:
    desc: Run every test
    cmds:
      - task: rust
      - task: js

  rust:
    desc: Run the Rust tests of the whole workspace
    cmd: cargo test --workspace

  js:
    desc: Run the UI's rule and message checks
    cmds:
      - node dev/account-check.ts
      - node dev/auto-check.ts
      - node dev/approve-check.ts
      - node dev/auth-check.ts
      - node dev/browse-check.ts
      - node dev/detail-check.ts
      - node dev/halt-check.ts
      - node dev/library-check.ts
      - node dev/playback-check.ts
      - node --import ./dev/controller-check/register.mjs dev/pairing-check.ts
      - node --import ./dev/controller-check/register.mjs dev/controller-check/check.mjs
      - node --import ./dev/controller-check/register.mjs dev/now-playing-check.ts
      - node dev/messages-check.ts
      - node dev/shortcuts-check.ts
      - node dev/contract/proxy-check.ts
      - node dev/contract/auth-flow-check.ts
      - node dev/contract/browse-check.ts
      - node dev/contract/pair-check.ts
      - cmd: node dev/web-build-check.ts
        # Only a web build in build/ is checked; `task build:web` makes one and marks it. A native build lands in build/ too.
        if: test -f build/.web-target
