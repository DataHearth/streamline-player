[package]
name = "engine"
version = "0.1.0"
edition = "2024"
authors = ["Antoine Langlois <dev@antoine-langlois.net>"]
description = "Streaming engine for Streamline"

[lib]
name = "engine"

[[bin]]
name = "engine"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
hex = "0.4.3"
hmac = "0.13.0"
humantime-serde = "1.1.1"
opentelemetry = "0.33.1"
opentelemetry-otlp = { version = "0.33.1", features = ["grpc-tonic", "metrics", "trace"] }
opentelemetry_sdk = "0.33.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["cors", "fs"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.34.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
filetime = "0.2.29"
