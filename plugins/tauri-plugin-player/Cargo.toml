[package]
name = "tauri-plugin-player"
version = "0.1.0"
edition = "2024"
authors = ["Antoine Langlois <dev@antoine-langlois.net>"]
description = "Native video player behind the webview (Media3 ExoPlayer on Android, libmpv on Linux)"
links = "tauri-plugin-player"

[dependencies]
tauri = { version = "2.12.5", features = [] }

[target.'cfg(target_os = "linux")'.dependencies]
gdk = "0.18.2"
gtk = "0.18.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde_json = "1.0.154"
webkit2gtk = "2.0.2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
