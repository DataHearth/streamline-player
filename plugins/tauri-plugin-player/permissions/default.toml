"$schema" = "schemas/schema.json"

[default]
description = "Allows controlling the native player and listening to its events"
permissions = [
  "allow-capabilities",
  "allow-load",
  "allow-play",
  "allow-pause",
  "allow-seek",
  "allow-stop",
  "allow-speed",
  "allow-stats",
  "allow-subtitle",
  "allow-timing",
  "allow-registerListener",
  "allow-removeListener",
  "allow-remove-listener",
]
